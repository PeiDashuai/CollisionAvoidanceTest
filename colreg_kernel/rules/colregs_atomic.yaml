- id: COLREG_R13_OVERTAKING_GIVEWAY
  article: Rule 13
  summary: 'Overtaking: overtaking vessel shall keep out of the way.'
  applicability:
    and:
    - eq:
      - encounter_type
      - overtaking
    - eq:
      - closing
      - true
  deontic:
    subject: ownship
    role: GIVE_WAY
    modality: OBLIGATORY
    strength: hard
  actions:
    maneuver:
      allowed:
      - primitive: TURN_STARBOARD
        params:
          min_delta_cog_deg: 10
      - primitive: REDUCE_SPEED
        params:
          min_decel: 0.1
      forbidden: []
    signals:
      lights_shapes_required: []
      lights_shapes_forbidden: []
      sounds_required: []
      sounds_forbidden: []
  evidence_requirements:
  - encounter_type
  - closing
  text_ref: 'Rule 13: Any vessel overtaking shall keep out of the way of the vessel
    being overtaken.'
- id: COLREG_R14_HEADON_ALTER_STARBOARD
  article: Rule 14
  summary: 'Head-on between power-driven vessels: each shall alter course to starboard.'
  applicability:
    and:
    - eq:
      - encounter_type
      - head_on
    - eq:
      - ownship.vessel_class
      - power
    - eq:
      - target.vessel_class
      - power
  deontic:
    subject: both
    role: BOTH
    modality: OBLIGATORY
    strength: hard
  actions:
    maneuver:
      allowed:
      - primitive: TURN_STARBOARD
        params:
          min_delta_cog_deg: 10
      forbidden: []
    signals:
      lights_shapes_required: []
      lights_shapes_forbidden: []
      sounds_required: []
      sounds_forbidden: []
  evidence_requirements:
  - encounter_type
  - ownship.vessel_class
  - target.vessel_class
  text_ref: 'Rule 14: each shall alter course to starboard so that each shall pass
    on the port side of the other.'
- id: COLREG_R15_CROSSING_GIVEWAY_TARGET_STARBOARD
  article: Rule 15
  summary: 'Crossing between power-driven vessels: if target is on starboard side,
    ownship shall give-way.'
  applicability:
    and:
    - eq:
      - encounter_type
      - crossing
    - eq:
      - ownship.vessel_class
      - power
    - eq:
      - target.vessel_class
      - power
    - eq:
      - is_target_on_starboard
      - true
    - or:
      - eq:
        - risk_of_collision
        - true
      - not:
          exists:
          - risk_of_collision
  deontic:
    subject: ownship
    role: GIVE_WAY
    modality: OBLIGATORY
    strength: hard
  actions:
    maneuver:
      allowed:
      - primitive: TURN_STARBOARD
        params:
          min_delta_cog_deg: 10
      - primitive: REDUCE_SPEED
        params:
          min_decel: 0.1
      forbidden:
      - primitive: TURN_PORT
        params: {}
    signals:
      lights_shapes_required: []
      lights_shapes_forbidden: []
      sounds_required: []
      sounds_forbidden: []
  evidence_requirements:
  - encounter_type
  - ownship.vessel_class
  - target.vessel_class
  - is_target_on_starboard
  text_ref: 'Rule 15: vessel which has the other on her own starboard side shall keep
    out of the way.'
- id: COLREG_R15_CROSSING_STANDON_TARGET_PORT
  article: Rule 15
  summary: 'Crossing between power-driven vessels: if target is on port side, ownship
    is stand-on (complement).'
  applicability:
    and:
    - eq:
      - encounter_type
      - crossing
    - eq:
      - ownship.vessel_class
      - power
    - eq:
      - target.vessel_class
      - power
    - eq:
      - is_target_on_starboard
      - false
    - or:
      - eq:
        - risk_of_collision
        - true
      - not:
          exists:
          - risk_of_collision
  deontic:
    subject: ownship
    role: STAND_ON
    modality: OBLIGATORY
    strength: soft
  actions:
    maneuver:
      allowed:
      - primitive: MAINTAIN_COURSE_SPEED
        params: {}
      forbidden: []
    signals:
      lights_shapes_required: []
      lights_shapes_forbidden: []
      sounds_required: []
      sounds_forbidden: []
  evidence_requirements:
  - encounter_type
  - ownship.vessel_class
  - target.vessel_class
  - is_target_on_starboard
  text_ref: Rule 15 (complement).
