[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colreg-reasoner"
version = "0.1.0"
description = "COLREG reasoning (Part 2): pairwise rule relations and conflict resolution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "colreg-kernel>=0.1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colreg_reasoner = ["rules/*.yaml"]
